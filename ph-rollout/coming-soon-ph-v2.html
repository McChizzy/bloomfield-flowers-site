<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloomfield PH Coming Soon Flyer V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1f121c; }
  body { font-family: "Montserrat", Arial, sans-serif; }
  .flyer {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    color: #fff8f4;
    background: #1f121c;
  }
  .photo {
    position: absolute;
    inset: 0;
    background: url("assets/coming-soon-magenta-white.jpg") center 42% / 118% auto no-repeat;
    filter: saturate(1.09) contrast(1.03) brightness(.94);
  }
  .scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(20,11,18,.82) 0%, rgba(20,11,18,.2) 24%, rgba(20,11,18,.08) 43%, rgba(20,11,18,.58) 69%, rgba(20,11,18,.96) 100%),
      radial-gradient(circle at 50% 37%, rgba(255,255,255,.1), rgba(255,255,255,0) 43%);
  }
  .frame {
    position: absolute;
    inset: 34px;
    border: 1.5px solid rgba(255,248,244,.7);
  }
  .frame::after {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(210,155,178,.72);
  }
  .logo {
    position: absolute;
    top: 46px;
    left: 50%;
    width: 168px;
    height: 168px;
    object-fit: contain;
    transform: translateX(-50%);
    filter: drop-shadow(0 9px 24px rgba(0,0,0,.52));
  }
  .copy {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 78px;
    padding: 0 78px;
    text-align: center;
  }
  .kicker {
    margin-bottom: 16px;
    padding-left: .34em;
    color: #f3d8dd;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .34em;
    line-height: 1.2;
    text-transform: uppercase;
    text-shadow: 0 4px 18px rgba(0,0,0,.82);
  }
  h1 {
    color: #fff;
    font-family: "Playfair Display", Georgia, serif;
    font-size: 99px;
    font-weight: 800;
    letter-spacing: 0;
    line-height: .98;
    text-shadow: 0 9px 34px rgba(0,0,0,.84);
  }
  .sub {
    max-width: 870px;
    margin: 23px auto 0;
    color: #fff5f1;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 39px;
    font-style: italic;
    font-weight: 600;
    line-height: 1.18;
    text-shadow: 0 5px 20px rgba(0,0,0,.86);
  }
  .cta {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin-top: 29px;
    min-width: 332px;
    padding: 18px 28px;
    border: 1px solid rgba(255,248,244,.74);
    background: rgba(31,18,28,.68);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .16em;
    line-height: 1.1;
    text-transform: uppercase;
  }
  .handle {
    margin-top: 27px;
    padding-left: .28em;
    color: #f4dde0;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: .28em;
    line-height: 1.2;
    text-shadow: 0 3px 16px rgba(0,0,0,.82);
  }
</style>
</head>
<body>
  <main class="flyer" aria-label="Bloomfield Flowers Port Harcourt launch awareness flyer">
    <div class="photo"></div>
    <div class="scrim"></div>
    <div class="frame"></div>
    <img class="logo" src="assets/logo-pink-transparent.png" alt="Bloomfield Flowers">
    <section class="copy">
      <p class="kicker">Port Harcourt</p>
      <h1>Flowers Are<br>Coming To PH</h1>
      <p class="sub">Bloomfield bouquets are getting ready for birthdays, love notes, apologies, and beautiful surprises.</p>
      <div class="cta">Coming soon</div>
      <p class="handle">@bloomfieldflowers_</p>
    </section>
  </main>
</body>
</html>
